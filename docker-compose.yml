version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kulcha-network
    volumes:
      - ./frontend/public:/app/public
      - ./frontend/src:/app/src
    environment:
      - TUNNEL_URL=${TUNNEL_URL:-}
      - LHR_LIFE_DOMAIN=${LHR_LIFE_DOMAIN:-ec4db675c64c9f.lhr.life}
      - REACT_APP_API_URL=/api
    restart: unless-stopped
    mem_limit: 512M
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*,localhost,127.0.0.1,backend,frontend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://frontend,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://0.0.0.0,http://0.0.0.0:80}
      - TUNNEL_URL=${TUNNEL_URL:-}
      - LHR_LIFE_DOMAIN=${LHR_LIFE_DOMAIN:-ec4db675c64c9f.lhr.life}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-rw$s6dlz*zpdcyf=rocqmy#85j4f-1%6_%d42^deg4xncp7nw4}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kulcha_user}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-kulcha}
    volumes:
      - backend_media:/app/media
      - backend_static:/app/static
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - kulcha-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1G
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-kulcha}
      - POSTGRES_USER=${POSTGRES_USER:-kulcha_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
    ports:
      - "5432:5432"
    networks:
      - kulcha-network
    restart: unless-stopped
    mem_limit: 512M
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kulcha_user} -d ${POSTGRES_DB:-kulcha}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  kulcha-network:
    driver: bridge

volumes:
  postgres_data:
  backend_media:
  backend_static: 